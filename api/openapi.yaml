openapi: 3.1.0
info:
  title: Village Hall API
  version: 0.1.0
  summary: The board server's HTTP API.
  description: >-
    The document declares the probe, documentation, browser-login, API-key, initiative, task, event, lease and check-in operations.
    Every later operation is added here first; the Go server code and the TypeScript client are generated from
    this document and ci/lint.sh fails when either is stale.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: probes
    description: Liveness and readiness.
  - name: docs
    description: This document and the interactive API documentation.
  - name: auth
    description: Browser login through OpenID Connect, and the browser session.
  - name: keys
    description: API keys for agents, created, listed and revoked by any authenticated principal.
  - name: initiatives
    description: Initiatives, the groups of tasks, with tags.
  - name: tasks
    description: Tasks, the units of work and the watches, created, read and edited.
  - name: leases
    description: Leases, the claims an actor makes on a task, with their expiry and conflicts.
  - name: asks
    description: Asks, the questions an actor raises for the operator, with their answers and withdrawals.
  - name: notes
    description: Notes, the findings an actor posts on a task, an initiative, a resource or the whole board.
  - name: attention
    description: What needs the operator now, in five sections with their counts.
  - name: events
    description: The audit trail, listed with filters and paging.
  - name: notifications
    description: The alert outbox, listed by delivery state with paging.
  - name: actors
    description: The actors with their live leases, open asks and when each was last seen.
  - name: timeline
    description: The tasks, leases and markers of a window of time, for the Timeline view.
  - name: stream
    description: The live server-sent event stream the web UI refreshes from.
  - name: meta
    description: The server's versions, the caller, and the agent protocol the caller has read.
  - name: composite
    description: The shortcut operations the agent commands are built on, each one transaction.
paths:
  /healthz:
    get:
      operationId: getHealthz
      tags: [probes]
      summary: Liveness probe
      description: Answers 200 whenever the process is up. The only unauthenticated operation.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]
  /readyz:
    get:
      operationId: getReadyz
      tags: [probes]
      summary: Readiness probe
      description: >-
        Answers 200 when the database is reachable and migrated, 503 otherwise.
        A presented key the database cannot check also gets 503, as a problem document.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The server is ready.
          content:
            text/plain:
              schema:
                type: string
                examples: [ok]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: The server is not ready.
          content:
            text/plain:
              schema:
                type: string
                examples: [not ready]
  /api/openapi.yaml:
    get:
      operationId: getOpenapiYAML
      tags: [docs]
      summary: This document as YAML
      description: Serves api/openapi.yaml, the source of truth for the API.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/openapi.json:
    get:
      operationId: getOpenapiJSON
      tags: [docs]
      summary: This document as JSON
      description: The same document as /api/openapi.yaml, converted to JSON.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/docs:
    get:
      operationId: getDocs
      tags: [docs]
      summary: Interactive API documentation
      description: >-
        Swagger UI, served from assets embedded in the binary, listing every
        operation of this document. Its Authorize button takes a `bearerAuth` key.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The documentation page.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/docs/assets/{name}:
    get:
      operationId: getDocsAsset
      tags: [docs]
      summary: A Swagger UI asset
      description: A script or stylesheet of the page at /api/docs, embedded in the binary.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The asset's file name.
          schema:
            type: string
      responses:
        "200":
          description: The asset.
          content:
            text/javascript:
              schema:
                type: string
            text/css:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: List the API keys
      description: >-
        Every key, oldest first. A key is described by its name and display prefix
        only: the key itself is shown once, by the response that created it, and is
        stored nowhere.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createKey
      tags: [keys]
      summary: Create an API key
      description: >-
        Makes a key called `name`, with an optional expiry, and returns the key in
        `key` exactly once. Appends a `key_created` event that records the
        caller's principal and `Board-Actor` handle in separate columns.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyCreate"
      responses:
        "201":
          description: The key was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/keys/{name}/revoke:
    post:
      operationId: revokeKey
      tags: [keys]
      summary: Revoke an API key
      description: >-
        Sets `revoked_at`, so the key gets 401 from its next request on. Revoking a
        revoked key changes nothing and answers 200 with the first revocation time.
        A revocation that happens appends a `key_revoked` event.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: The key's name.
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The key, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives:
    get:
      operationId: listInitiatives
      tags: [initiatives]
      summary: List the initiatives
      description: >-
        A page of initiatives ordered by id (creation order). `tag` may repeat and keeps
        the initiatives that carry every tag given. `limit` is 1 to 1000, default 100.
        `after` is the id or slug of the last initiative of the previous page; the
        response's `next_after` is the value to send, and is absent on the last page.
        `status` is `open` (the default), `closed` or `all`. `closed_within` keeps the
        initiatives closed in the last 7d, 30d, 90d or an integer of days, and needs
        `status` `closed` or `all` (with `all` the open initiatives stay); with `open` it is 400.
        Each item carries the `counts` of its tasks by status, its `live_leases` and its `attention_count`. Before it
        reads, the list expires the leases whose `expires_at` has passed.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tag
          in: query
          required: false
          description: Keep initiatives that carry this tag. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          required: false
          description: Which initiatives to keep. Default `open`.
          schema:
            type: string
            enum: [open, closed, all]
        - name: closed_within
          in: query
          required: false
          description: "`7d`, `30d`, `90d` or an integer of days. Only with `status` `closed` or `all`."
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: The page size, 1 to 1000. Default 100.
          schema:
            type: integer
        - name: after
          in: query
          required: false
          description: An initiative ULID or slug, in either letter case. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createInitiative
      tags: [initiatives]
      summary: Create an initiative
      description: >-
        Makes an initiative with a slug of 2 to 40 characters of `a-z`, `0-9` and `-`.
        A slug already taken is 409 with a `next` that says how to read it. Appends an
        `initiative_created` event that records the caller's principal and `Board-Actor`
        handle in separate columns, and upserts the actor.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeCreate"
      responses:
        "201":
          description: The initiative was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives/{slug}:
    get:
      operationId: getInitiative
      tags: [initiatives]
      summary: Read an initiative
      description: >-
        The initiative whose slug (its ref) or ULID is given, with its `attention_count`: how many of its tasks
        have a non-empty `attention` list (see `GET /api/v1/tasks`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
      responses:
        "200":
          description: The initiative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiativeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: patchInitiative
      tags: [initiatives]
      summary: Edit an initiative
      description: >-
        Changes the fields sent. A field left out keeps its value, `tags` replaces the set, and `null` clears
        `target_start` and `target_end` and is 400 for the others. The same field rules as a create apply to the
        initiative as it would be after the patch. `slug` is immutable, and sending it, even unchanged, is 400. A
        patch that changes nothing, such as `{}`, answers 200 and writes no row, event or actor. A change appends
        `initiative_updated` whose `data.changed` names the changed fields. An unknown initiative is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativePatch"
      responses:
        "200":
          description: The initiative after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives/{slug}/close:
    post:
      operationId: closeInitiative
      tags: [initiatives]
      summary: Close an initiative
      description: >-
        Closes an open initiative, setting `closed_at` and `closed_by` and appending `initiative_closed`. An initiative
        with no task that is not closed closes at once. With an open or done task and no `force`, the answer is 409 and
        its `next` names the `force` option. With `force` true every task that is not closed is first closed
        `dropped`, each with its `task_closed` event, and then the initiative closes, all in one transaction. A closed
        initiative cannot take new tasks or edits to its tasks, and closing a closed initiative is 409. An unknown
        initiative is 404. A `Board-On-Behalf-Of` header is stored as the `on_behalf_of` of the events.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiativeClose"
      responses:
        "200":
          description: The initiative after the close.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/initiatives/{slug}/reopen:
    post:
      operationId: reopenInitiative
      tags: [initiatives]
      summary: Reopen a closed initiative
      description: >-
        Reopens a closed initiative, clearing `closed_at` and `closed_by` and appending `initiative_reopened`. Its
        tasks stay closed. Reopening an open initiative is 409. An unknown initiative is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The initiative's slug or ULID.
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The initiative after the reopen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List the tasks
      description: >-
        A page of tasks ordered by id (creation order), each with its live leases. Filters combine.
        `ref` (a task ref) may repeat: a task is kept when its ref is any of those given, which is how a view reads the tags of the tasks it shows.
        `initiative` (slug or ULID) and `tag` may repeat: a task is kept when it is in any of the
        initiatives given (OR) and matches every tag given (AND); a task matches a tag when the tag is one of its own tags, one of its initiative's tags or a derived actor-kind tag (a kind among ralph, claude, pi, codex, deck of any holder of a lease on it, live or ended). A single value means what it always did. `status=closed` is the Archive list. `status` is `open`, `done`, `closed`,
        `not_closed` (the default) or `all`. `kind` is `work` or `watch`. `active` (has a live lease), `blocked` (has
        an open dependency or an open blocking ask) and `overdue` (a watch task past its `next_check_at`) are `true` or `false`.
        `attention` is `true` (keeps the tasks that need a person: a non-empty `attention` list) or `false` (those that
        do not); any other value is 400.
        `closed_within` (`7d`, `30d`, `90d` or an integer of days) is for `status` `closed` or `all`: it keeps the
        tasks closed within that many days and, with `all`, the tasks that are not closed. `q` keeps the tasks whose
        title or description contains the text, ignoring letter case. `limit` is 1 to 1000, default 100. `after` is
        the id or ref of the last task of the previous page; the response's `next_after` is the value to send, and is
        absent on the last page. Overdue leases are expired before the list is read, so a task whose lease ran out is
        not active. An initiative that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: ref
          in: query
          required: false
          description: Keep only the tasks with this ref, such as `aa-1`, in either letter case. Repeatable; a task is kept when its ref is any of those given, and a ref that names no task keeps nothing. Left out, it keeps every task.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: initiative
          in: query
          required: false
          description: Keep tasks of this initiative, by slug or ULID. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: tag
          in: query
          required: false
          description: Keep tasks that match this tag as their own, their initiative's or a derived actor-kind tag. Repeatable; every tag given must match (AND).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          required: false
          description: The task status to keep. Default `not_closed`.
          schema:
            type: string
            enum: [open, done, closed, not_closed, all]
        - name: kind
          in: query
          required: false
          description: Keep tasks of this kind.
          schema:
            type: string
            enum: [work, watch]
        - name: active
          in: query
          required: false
          description: "`true` keeps tasks with a live lease, `false` those without."
          schema:
            type: boolean
        - name: blocked
          in: query
          required: false
          description: "`true` keeps tasks with an open dependency or an open blocking ask, `false` those without."
          schema:
            type: boolean
        - name: overdue
          in: query
          required: false
          description: "`true` keeps overdue watch tasks, `false` the tasks that are not overdue."
          schema:
            type: boolean
        - name: attention
          in: query
          required: false
          description: "`true` keeps tasks whose `attention` list is not empty, `false` those whose list is empty."
          schema:
            type: boolean
        - name: closed_within
          in: query
          required: false
          description: "`7d`, `30d`, `90d` or an integer of days. Only with `status` `closed` or `all`."
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: A text that the title or the description contains, in either letter case.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: The page size, 1 to 1000. Default 100.
          schema:
            type: integer
        - name: after
          in: query
          required: false
          description: A task ULID or ref, in either letter case. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      description: >-
        Makes a task in an open initiative, numbered `<slug>-<seq>` from 1 within it and never reused.
        `kind` is `work` (the default) or `watch`. A watch task needs `cadence_seconds` (60 to 31536000) and
        its `next_check_at` defaults to now plus the cadence. A work task that sends either watch field is 400.
        `blocked_by` names tasks (ref or ULID) the new task starts out blocked by. A bad field is 400 and
        writes no row, event or actor. An unknown initiative or blocker is 404 and a closed initiative is 409.
        Appends `task_created`, and `dep_added` for each blocker.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: The task was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/count:
    get:
      operationId: countTasks
      tags: [tasks]
      summary: Count the tasks
      description: >-
        How many tasks the filters keep, as `{count}` and no rows: the count form of `GET /api/v1/tasks`, for a badge that
        needs a number and not the tasks. The filters are those of the list, with the same meaning and the same defaults
        (`status` is `not_closed` unless given, so a closed task is not counted unless `status` is `closed` or `all`),
        except `q`, `limit` and `after`, which it does not read. Overdue leases are expired before the count is read, so a task whose
        lease ran out is not active. An initiative that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: ref
          in: query
          required: false
          description: Keep only the tasks with this ref, such as `aa-1`, in either letter case. Repeatable; a task is kept when its ref is any of those given, and a ref that names no task keeps nothing. Left out, it keeps every task.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: initiative
          in: query
          required: false
          description: Keep tasks of this initiative, by slug or ULID. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: tag
          in: query
          required: false
          description: Keep tasks that match this tag as their own, their initiative's or a derived actor-kind tag. Repeatable; every tag given must match (AND).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          required: false
          description: The task status to keep. Default `not_closed`.
          schema:
            type: string
            enum: [open, done, closed, not_closed, all]
        - name: kind
          in: query
          required: false
          description: Keep tasks of this kind.
          schema:
            type: string
            enum: [work, watch]
        - name: active
          in: query
          required: false
          description: "`true` keeps tasks with a live lease, `false` those without."
          schema:
            type: boolean
        - name: blocked
          in: query
          required: false
          description: "`true` keeps tasks with an open dependency or an open blocking ask, `false` those without."
          schema:
            type: boolean
        - name: overdue
          in: query
          required: false
          description: "`true` keeps overdue watch tasks, `false` the tasks that are not overdue."
          schema:
            type: boolean
        - name: attention
          in: query
          required: false
          description: "`true` keeps tasks whose `attention` list is not empty, `false` those whose list is empty."
          schema:
            type: boolean
        - name: closed_within
          in: query
          required: false
          description: "`7d`, `30d`, `90d` or an integer of days. Only with `status` `closed` or `all`."
          schema:
            type: string
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/tag-sources:
    get:
      operationId: getTagSources
      tags: [tasks]
      summary: The sources of tags on the tasks
      description: >-
        Answers `{tag: [sources]}`: for every tag some task shows, the sources it has on the tasks the filter keeps, in the order
        `task` (an own tag), `initiative` (a tag of the task's initiative), `actor` (derived from the kind of a lease holder,
        live or ended). A tag no kept task carries has no entry, and no task at all answers `{}`. `tag` (repeatable) limits the answer
        to those tags, trimmed and lowercased as a task tag is, so a view reads the sources of every tag it shows in one request.
        `status` keeps the list's meaning and default (`not_closed`, so a closed task adds no source unless `status` is
        `closed` or `all`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tag
          in: query
          required: false
          description: Answer only this tag. Repeatable; left out, every tag is answered.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: status
          in: query
          required: false
          description: The task status whose tasks count. Default `not_closed`.
          schema:
            type: string
            enum: [open, done, closed, not_closed, all]
      responses:
        "200":
          description: The sources of each tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSources"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Read a task
      description: >-
        The task whose ref (`<slug>-<seq>`) or ULID is given, in either letter case, with the tasks it is blocked
        by (`deps`), the tasks it blocks (`blocking`), its live leases, its open asks (`open_asks`) and the derived `active`,
        `blocked` (an open dependency or an open blocking ask) and `overdue`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: patchTask
      tags: [tasks]
      summary: Edit a task
      description: >-
        Changes the fields sent. A field left out keeps its value, `null` clears `planned_start`, `planned_end` and
        `next_check_at`, a watch task's `cadence_seconds` cannot be cleared (`null` is 400) and stays 60 to 31536000,
        and `external_refs` replaces the list. `kind` and `initiative` are
        immutable, and sending either is 400. A patch that changes nothing answers 200 and writes no row, event or
        actor. A change appends `task_updated` whose `data.changed` names the changed fields. A closed task, or a
        task of a closed initiative, is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatch"
      responses:
        "200":
          description: The task after the edit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/done:
    post:
      operationId: doneTask
      tags: [tasks]
      summary: Mark a task done
      description: >-
        Moves an open task to `done`, setting `done_at` and `done_by`, and appends `task_done`. A task that is
        already done or is closed is 409 and the problem names its current status. A done task never holds a live
        lease. A live lease the caller holds on the task ends in the same transaction (`lease_ended`, outcome the
        `outcome` sent, else `done`). A live lease of another actor makes the request 409, the problem naming the
        holder, the lease and its intent, and nothing changes. With `force: true` every live lease on the task, the
        caller's own included, is ended in the same transaction, `ended_by` the caller and outcome `ended: task
        marked done by <handle>`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskDone"
      responses:
        "200":
          description: The task after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/reopen:
    post:
      operationId: reopenTask
      tags: [tasks]
      summary: Reopen a task
      description: >-
        Moves a done or closed task back to `open`, clearing `resolution`, `done_at`, `done_by`, `closed_at` and
        `closed_by`, and appends `task_reopened`. An open task is 409 and the problem names its status. A task of
        a closed initiative is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The task after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/close:
    post:
      operationId: closeTask
      tags: [tasks]
      summary: Close a task
      description: >-
        Moves an open or done task to `closed` with the `resolution` sent (`completed`, `dropped`, `superseded` or
        `duplicate`), setting `closed_at` and `closed_by`, and appends `task_closed` whose `data.resolution` is the
        resolution. A missing or unknown resolution is 400. A closed task is 409 and the problem names its status.
        Every live lease on the task, the caller's own included, is ended in the same transaction (`lease_ended`,
        `ended_by` the caller, outcome `ended: task closed by <handle>`).
        A `Board-On-Behalf-Of` header names the actor the close is made for, such as `operator` when an agent
        closes on instruction, and is stored as the event's `on_behalf_of`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskClose"
      responses:
        "200":
          description: The task after the transition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/deps/{blockedByRef}:
    post:
      operationId: addTaskDep
      tags: [tasks]
      summary: Make a task blocked by another
      description: >-
        Makes the task `ref` blocked by the task `blockedByRef`, which may be in another initiative, and appends
        `dep_added` on `ref` whose `data.blocked_by` is the blocker's ref. Answers 200 with the dependent task.
        Adding a dependency that exists is 200 too and writes nothing. A task blocked by itself is 400. A
        dependency that would close a cycle of any length is 409 and the problem's `detail` names the path. An
        unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/BlockedByRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The dependent task, with its `deps`, `blocking` and derived `blocked`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeTaskDep
      tags: [tasks]
      summary: Remove a task's dependency on another
      description: >-
        Removes the dependency of the task `ref` on the task `blockedByRef` and appends `dep_removed` on `ref`
        whose `data.blocked_by` is the blocker's ref. Answers 200 with the dependent task. A dependency that does
        not exist, or an unknown task, is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/BlockedByRef"
      responses:
        "200":
          description: The dependent task after the removal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/tags/{tag}:
    put:
      operationId: addTaskTag
      tags: [tasks]
      summary: Give a task one tag
      description: >-
        Adds the tag `tag` to the task `ref`'s own tags, after trimming and lowercasing it as an initiative tag is
        (a-z, 0-9, `.`, `_`, `:` and `-`, starting with a letter or digit, at most 40 characters). A change inserts
        the row, moves `updated_at` and appends `task_updated` whose `data` is `{ref, changed: ["tags"], tag,
        change: "added"}`, in one transaction. Answers 200 with the task. A tag the task already has is 200 too and
        writes nothing. A tag that breaks the rule, or a 21st tag, is 400 and changes nothing. A closed task, or a
        task of a closed initiative, is 409. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/TaskTag"
      responses:
        "200":
          description: The task with its `tags` after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeTaskTag
      tags: [tasks]
      summary: Take one tag off a task
      description: >-
        Removes the tag `tag` (normalised as for `PUT`) from the task `ref`'s own tags and appends `task_updated`
        whose `data` is `{ref, changed: ["tags"], tag, change: "removed"}`, in one transaction. Answers 200 with the
        task. A tag the task does not have is 200 too and writes nothing. A tag that breaks the rule is 400. A
        closed task, or a task of a closed initiative, is 409. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/TaskTag"
      responses:
        "200":
          description: The task with its `tags` after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/checks:
    post:
      operationId: recordTaskCheck
      tags: [tasks]
      summary: Record a check on a watch task
      description: >-
        Appends `check_recorded` on a watch task and moves its `next_check_at` to the time sent, or to now plus the
        task's cadence when none is sent. Answers 200 with the task. A work task, or a closed watch task, is 409. A
        `summary` that is empty or longer than 200 characters is 400. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCheck"
      responses:
        "200":
          description: The task, with its new `next_check_at` and derived `overdue`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/milestones:
    post:
      operationId: recordTaskMilestone
      tags: [tasks]
      summary: Record a milestone on a task
      description: >-
        Appends `milestone` on a task of any kind and status; the task row is not touched. The event's `data` carries
        the task `ref`, the `summary` and, when sent, the caller's `data` object under the key `data`. Answers 200
        with the task. A `summary` that is empty or longer than 200 characters is 400. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskMilestone"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{ref}/events:
    get:
      operationId: listTaskEvents
      tags: [tasks]
      summary: List a task's events
      description: >-
        A page of the events that name the task, in the order they were written. `limit` is 1 to 1000, default 100.
        `after` is the id or `E<n>` ref of the last event of the previous page; the response's `next_after` is the
        value to send, and is absent on the last page. An unknown task is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TaskRef"
        - $ref: "#/components/parameters/EventLimit"
        - $ref: "#/components/parameters/EventAfter"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      description: >-
        A page of events in the order they were written. Filters combine: `since` keeps the events after an event
        (its id or `E<n>` ref), from an RFC 3339 time on, or after the caller's `events` cursor (`since=cursor`; with no
        cursor set it reads from the start), `initiative` (slug or ULID) and `task` (ref or ULID) keep
        the events that name them, `type` keeps the events of any of the types given and `actor` those of one
        handle. `limit` is 1 to 1000, default 100. `after` is the id or `E<n>` ref of the last event of the previous
        page; the response's `next_after` is the value to send, and is absent on the last page. An initiative or
        task filter that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            An event id, an `E<n>` ref (either letter case), an RFC 3339 time, or `cursor` for the caller's `events`
            cursor.
          schema:
            type: string
        - name: initiative
          in: query
          required: false
          description: An initiative slug or ULID.
          schema:
            type: string
        - name: task
          in: query
          required: false
          description: A task ref or ULID.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Keep events of this type. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: actor
          in: query
          required: false
          description: Keep the events of this actor handle.
          schema:
            type: string
        - $ref: "#/components/parameters/EventLimit"
        - $ref: "#/components/parameters/EventAfter"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the alert outbox
      description: >-
        A page of the notification outbox (the alerts of SPEC 5.4), newest first by creation time and then id, so an
        operator sees what was delivered and what failed. `state` keeps the rows `pending`, `sent` or `failed`; left
        out, every row is listed. `limit` is 1 to 1000, default 100. `after` is the id of the last row of the previous
        page; the response's `next_after` is the value to send, and is absent on the last page. An unknown `state`, a
        `limit` out of range or an `after` that names no row is 400. The rows carry no header value, key or session:
        the payload is what the receiver was sent.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: Keep the rows in this state.
          schema:
            type: string
            enum: [pending, sent, failed]
        - $ref: "#/components/parameters/EventLimit"
        - name: after
          in: query
          required: false
          description: A notification id. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/timeline:
    get:
      operationId: getTimeline
      tags: [timeline]
      summary: Read the timeline of a window
      description: >-
        The tasks, leases and markers that fall in a window of time, with the initiatives that hold the tasks, for the
        Timeline view. `from` and `to` are RFC 3339 instants; `to` must be after `from` and at most 400 days after it;
        left out they default to 14 days before now and 7 days after now. A task is in the window when its actual span
        (`created_at` to `closed_at`, open-ended while it is not closed, so an open task is in every window that ends
        after it was created) or its planned span overlaps it; a lease when its span (`started_at` to its end, open
        while it is live) overlaps it, so a window that cuts a lease keeps it; a marker when its `at` is inside it. Closed tasks are left out unless `closed_within` (`7d`, `30d`, `90d` or an
        integer of days) keeps those closed that recently; the leases and markers of a task that is left out are left
        out with it. `initiative` (by slug or ULID, repeatable) and `tag` (repeatable; a task must match every
        tag given, as its own, its initiative's or a derived actor-kind tag) keep tasks as they do for `GET /api/v1/tasks`; `actor` (a handle) keeps the tasks on which that actor
        held a lease in the window. `rows` `all` keeps the tasks wherever their spans fall, so the window picks only the
        leases and markers and the rows of a view stay the same as it pans or zooms; `actor` then keeps the tasks on
        which that actor ever held a lease. `rows` `window` (the default) keeps the tasks in the window. Each task's
        `attention` list is the one of `GET /api/v1/tasks`. Leases that ran out
        are expired before the read, but only once the request is accepted: a refused request changes nothing. Everything is in stable order: initiatives in board order, tasks by initiative
        then number, leases by number, markers by time then event. An unreadable time, `to` not after `from`, a window
        over 400 days, a bad `closed_within`, a `rows` that is neither `window` nor `all` (an empty `rows=` included), a `window`
        that is not `8h`, `24h` or `3d`, an `active` that is not `true` or `false` or a bad tag is 400; an initiative that names nothing is 404.


        `active` `true` keeps only the active tasks, and it adds to every other filter. A task is active when it has a live
        lease, or has any attention reason (stranded, asking or done and not closed: a non-empty `attention` list), or
        has an event in the last `window` (`8h`, `24h` by default, or `3d`, counted back from now: the Now view's window,
        not the `from` and `to` of the chart). This is the one definition of active the Timeline's Only active filter and
        Active first sort use. `active` `false` or left out keeps every task; `window` alone changes nothing.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: active
          in: query
          required: false
          description: "`true` keeps only the active tasks: a live lease, any attention reason, or an event in the last `window`."
          schema:
            type: boolean
        - name: window
          in: query
          required: false
          description: "How far back an event makes a task active: `8h`, `24h` (the default) or `3d`. Used only with `active=true`."
          schema:
            $ref: "#/components/schemas/NowWindow"
        - name: from
          in: query
          required: false
          description: The start of the window, RFC 3339. Default 14 days before now.
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: The end of the window, RFC 3339. Default 7 days after now.
          schema:
            type: string
        - name: initiative
          in: query
          required: false
          description: Keep tasks of this initiative, by slug or ULID. Repeatable.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: tag
          in: query
          required: false
          description: Keep tasks that match this tag as their own, their initiative's or a derived actor-kind tag. Repeatable; every tag given must match (AND).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: actor
          in: query
          required: false
          description: A handle. Keeps the tasks on which this actor held a lease in the window.
          schema:
            type: string
        - name: closed_within
          in: query
          required: false
          description: "`7d`, `30d`, `90d` or an integer of days. Adds the tasks closed that recently."
          schema:
            type: string
        - name: rows
          in: query
          required: false
          description: "`window` (the default) keeps the tasks in the window; `all` keeps them wherever their spans fall."
          schema:
            type: string
            enum: [window, all]
            default: window
      responses:
        "200":
          description: The window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/stream:
    get:
      operationId: getStream
      tags: [stream]
      summary: Stream events (server-sent events)
      description: >-
        A `text/event-stream` of what happens on the board, flushed as it is written. `topics` is a comma-separated
        list of `events` and `attention`; the default is both and any other topic is 400. Topic `events` sends one
        message per event, in the order they were written: `event: board`, `id:` the event's ULID and `data:` the
        event as one JSON line, the same object `GET /api/v1/events` lists. A comment line `: ping` is sent every
        `BOARD_STREAM_HEARTBEAT` (default 25 s) so an idle connection stays open. The stream ends when the client
        disconnects or the server shuts down. **Resume:** a `Last-Event-ID` header (the header wins) or a
        `last_event_id` query parameter, the ULID of the last event the client has, makes the stream send every event
        written after it, in order, before the live ones, with no gap and no duplicate. When more than 1000 events
        would be replayed, or the id names no event, the stream sends one `event: reset` (no `id`, `data` a JSON
        object whose `reason` is `unknown_id` or `too_many`) instead of any replay and continues live; the client
        then refetches what it shows. Resume applies to the `events` topic. Topic `attention` sends `event: attention` with
        `data:` the counts of `GET /api/v1/attention?fields=counts` (one JSON line, no `id`), once on connect and again
        whenever they differ from the ones last sent. They are recomputed after every change-feed event and at least every
        30 s, so a watch that falls overdue or a lease that expires is sent without an event.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: topics
          in: query
          required: false
          description: The topics to receive, comma-separated. Default `events,attention`.
          schema:
            type: array
            items:
              type: string
              enum: [events, attention]
          style: form
          explode: false
        - name: last_event_id
          in: query
          required: false
          description: The id of the last event the client has, as the `Last-Event-ID` header; the header wins.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: The id of the last event the client has; an `EventSource` sends it when it reconnects.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The stream, `Content-Type: text/event-stream`, with `Cache-Control` no-cache and `X-Accel-Buffering` no.
            The body is not described as a schema: a generated reader for it would be code the server never runs.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases:
    post:
      operationId: startLease
      tags: [leases]
      summary: Start a lease
      description: >-
        Starts a lease for the caller on `task` with the `intent` (1 to 200 characters), answering the lease and the
        conflicts. `ttl_seconds` is clamped to 60 to 43200 and defaults to 7200. `resources` is at most 20 strings of
        1 to 100 characters, repeats dropped. A closed task is 409 and an unknown task 404. When the caller already
        holds a live lease on the task, that lease is renewed instead (same lease, 200, `lease_renewed`); otherwise the
        answer is 201 and the event `lease_started`. `conflicts` lists the live leases of others that hold one of the
        same resources, each with only the shared resources.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseStart"
      responses:
        "200":
          description: The actor already held a live lease on the task, and it was renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResult"
        "201":
          description: A new lease was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listLeases
      tags: [leases]
      summary: List leases
      description: >-
        A page of leases, oldest first, after expiring the leases that are due. Filters combine: `state` is `live`
        (the default), `ended`, `expired` or `all`; `actor` keeps the leases of one handle, `task` (ref or ULID) those on
        one task and `resource` those holding that resource. `limit` is 1 to 1000, default 100. `after` is the `L<n>` ref or
        id of the last lease of the previous page; `next_after` is the value to send, absent on the last page. A `task`
        that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: live (default), ended, expired or all.
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Keep the leases of this actor handle.
          schema:
            type: string
        - name: task
          in: query
          required: false
          description: A task ref or ULID.
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: Keep the leases that hold this resource.
          schema:
            type: string
        - $ref: "#/components/parameters/EventLimit"
        - name: after
          in: query
          required: false
          description: A lease ref (`L<n>`) or id. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}:
    get:
      operationId: getLease
      tags: [leases]
      summary: Read a lease
      description: >-
        Reads one lease by `L<n>` ref (either letter case) or ULID, after expiring the leases that are due. 404 for none.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}/renew:
    post:
      operationId: renewLease
      tags: [leases]
      summary: Renew a lease
      description: >-
        Pushes `expires_at` to now plus the ttl (`ttl_seconds` clamped, or the lease's own) and may replace the `intent`
        and the `resources`; appends `lease_renewed`. Any actor may renew. An expired lease is 410 and the problem carries
        `expired_at`; an ended lease is 409. The answer is the lease and its conflicts.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRenew"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaseResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}/end:
    post:
      operationId: endLease
      tags: [leases]
      summary: End a lease
      description: >-
        Ends a live lease with the optional `outcome` (at most 200 characters) and appends `lease_ended`. `ended_by` is
        set when the caller is not the holder. A lease that is not live is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseEnd"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/leases/{ref}/ack:
    post:
      operationId: ackLease
      tags: [leases]
      summary: Acknowledge an expired lease
      description: >-
        Records the caller's acknowledgement of an expired lease (`acked_at`, `acked_by`) and appends `lease_acked`;
        acknowledging it again changes nothing. A lease that has not expired is 409.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LeaseRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/asks:
    post:
      operationId: raiseAsk
      tags: [asks]
      summary: Raise an ask
      description: >-
        Raises an open ask by the caller. `question` is 1 to 200 characters on one line; `details` is at most 20000
        characters; `options` is at most 10 suggested answers of 1 to 80 characters each; `mode` is `stop` (default) or
        `poll`; `blocking` (default false) marks an ask that blocks its task. `task` is a task ref or ULID and
        `initiative` a slug or ULID; both may be left out for a board-wide ask. The initiative of an ask on a task is
        the task's: sending both is 400 unless the task belongs to that initiative. An unknown task or initiative is
        404, and a closed task or a closed initiative is 409. `lease_action` is what the raise does to the
        caller's live lease on the task: `none` (default) leaves it as it is, `keep` leaves it live, and `stop` ends it
        with the outcome `blocked on A<n>` (a `lease_ended` event) in the same transaction as the ask. A `keep` or `stop`
        with no live lease on the task, or with no task, still raises the ask and acts on nothing. Any other value is
        400. The answer is 201 with the ask and the event `ask_raised`, and the caller's `lease` on the task when
        `keep` or `stop` found one (ended for `stop`, still live for `keep`). A refused
        request writes no ask, event, lease end or actor.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRaise"
      responses:
        "201":
          description: The ask was raised, and the lease acted on when `lease_action` was `keep` or `stop`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskRaised"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listAsks
      tags: [asks]
      summary: List asks
      description: >-
        A page of asks ordered by id (raising order). Filters combine: `state` is `open` (the default), `answered`,
        `withdrawn` or `all`; `actor` keeps the asks of one asker handle, `task` (ref or ULID) those on one task and
        `initiative` (slug or ULID) those on one initiative. `limit` is 1 to 1000, default 100. `after` is the `A<n>`
        ref or id of the last ask of the previous page; `next_after` is the value to send, absent on the last page. A
        `task` or `initiative` that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: state
          in: query
          required: false
          description: open (default), answered, withdrawn or all.
          schema:
            type: string
        - name: actor
          in: query
          required: false
          description: Keep the asks raised by this actor handle.
          schema:
            type: string
        - name: task
          in: query
          required: false
          description: A task ref or ULID.
          schema:
            type: string
        - name: initiative
          in: query
          required: false
          description: An initiative slug or ULID.
          schema:
            type: string
        - $ref: "#/components/parameters/EventLimit"
        - name: after
          in: query
          required: false
          description: An ask ref (`A<n>`) or id. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/asks/{ref}:
    get:
      operationId: getAsk
      tags: [asks]
      summary: Read an ask
      description: >-
        Reads one ask by `A<n>` ref or ULID in either letter case, with its task ref, initiative slug, asker,
        `answered_by`, `on_behalf_of`, `channel`, times and the derived `asker_waiting`. 404 for none. With `wait=N`
        (1 to 300 seconds, anything else is 400) it returns at once when the ask is not open, otherwise holds the
        request until the ask is answered or withdrawn (the new state, 200) or N seconds pass (the still-open ask,
        200). The change feed wakes the wait, so an answer written through another server on the same database ends it
        within the feed's tail interval. While a wait is held the ask's `poll_seen_at` is set to now at the start, at
        least every 30 seconds and at the end, which is what makes `asker_waiting` true for a `poll` ask. With
        `until` as well (allowed with `wait` only, else 400), the hold also ends at that instant, by the server's
        clock, when it comes before the N seconds do, and the response is the ask as it stood at `until`, however late
        the server reads it and however late it reaches the client: an answer or withdrawal is in it only when there is
        proof its COMMIT returned by `until`, either a read of the ask that came back at or before `until` and found it
        ended, or the commit mark the server reads after the COMMIT returned being at or before `until`. One whose COMMIT
        returned after `until` is left out, the ask answered still open, whatever clock reading inside its transaction
        (`answered_at`, `withdrawn_at`) says. A request handled after `until` that finds the ask ended without such
        proof answers at once with the still-open ask.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AskRef"
        - name: wait
          in: query
          required: false
          description: Seconds to hold the request while the ask is open, 1 to 300.
          schema:
            type: integer
        - name: until
          in: query
          required: false
          description: >-
            The instant the hold ends at, if before `wait` runs out; the response is then the ask as it stood at
            that instant. Only with `wait`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/asks/{ref}/answer:
    post:
      operationId: answerAsk
      tags: [asks]
      summary: Answer an ask
      description: >-
        Moves an open ask to `answered` with the `answer` (1 to 20000 characters) and appends `ask_answered`.
        `channel` is `ui`, `api` or `relay`; left out it is `ui` for a browser session and `api` for a key.
        `on_behalf_of` is the handle of the person a relayed answer came from, allowed with channel `relay` only. An
        ask that is not open is 409 and the problem names its state. A refused request writes nothing.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AskRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskAnswer"
      responses:
        "200":
          description: The answered ask.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/asks/{ref}/withdraw:
    post:
      operationId: withdrawAsk
      tags: [asks]
      summary: Withdraw an ask
      description: >-
        Moves an open ask to `withdrawn` with the optional `reason` (at most 200 characters) and appends
        `ask_withdrawn`. An ask that is not open is 409 and the problem names its state. A refused request writes
        nothing.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AskRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskWithdraw"
      responses:
        "200":
          description: The withdrawn ask.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/notes:
    post:
      operationId: postNote
      tags: [notes]
      summary: Post a note
      description: >-
        Posts a note by the caller. `summary` is 1 to 200 characters on one line; `body` (Markdown) is at most 20000
        characters; `resource` is at most 100 characters such as `host:build-1`; `mentions` is at most 20 actor handles.
        `task` is a task ref or ULID and `initiative` a slug or ULID; the initiative of a note on a task is the task's,
        and sending both is 400 unless the task belongs to that initiative. A note with neither a task nor an
        initiative is a broadcast, whether or not it has a resource. An unknown task or initiative is 404; a closed
        task or initiative still takes notes. The answer is 201 with the note and the event `note_posted`, written for
        every note including a broadcast. A refused request writes no note, event or actor.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotePost"
      responses:
        "201":
          description: The note was posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes
      description: >-
        A page of notes ordered by id (posting order). Filters combine. `since` is a note ULID or `N<n>` ref (the notes
        after it), an RFC 3339 time (the notes at or after it) or `cursor` (the notes after the caller's `notes`
        cursor, or from the start when none is set); `ack=true` moves the caller's `notes` cursor to the last note
        returned (it stays put when the page is empty); `task` (ref or ULID) and `initiative` (slug or ULID)
        keep the notes on them, a task's notes belonging to its initiative; `resource` is repeatable and keeps the
        notes on any of the resources; `broadcast` is `only` or `exclude`; `mention` keeps the notes that mention
        one handle and `author` those written by one handle. `fields` is `summary` (the default: no `body`, but
        `has_body`) or `full` (with the bodies). `limit` is 1 to 1000, default 100. `after` is the `N<n>` ref or id of
        the last note of the previous page; `next_after` is the value to send, absent on the last page. A `task` or
        `initiative` that names nothing is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: A note ULID or `N<n>` ref, an RFC 3339 time, or `cursor` for the caller's `notes` cursor.
          schema:
            type: string
        - name: ack
          in: query
          required: false
          description: "`true` moves the caller's `notes` cursor to the last note of the page."
          schema:
            type: boolean
        - name: task
          in: query
          required: false
          description: A task ref or ULID.
          schema:
            type: string
        - name: initiative
          in: query
          required: false
          description: An initiative slug or ULID.
          schema:
            type: string
        - name: resource
          in: query
          required: false
          description: Keep notes on this resource. Repeatable; a note on any of them is kept.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: broadcast
          in: query
          required: false
          description: "`only` keeps the broadcasts, `exclude` drops them."
          schema:
            type: string
        - name: mention
          in: query
          required: false
          description: Keep the notes that mention this actor handle.
          schema:
            type: string
        - name: author
          in: query
          required: false
          description: Keep the notes written by this actor handle.
          schema:
            type: string
        - name: fields
          in: query
          required: false
          description: "`summary` (default) leaves the bodies out, `full` includes them."
          schema:
            type: string
        - $ref: "#/components/parameters/EventLimit"
        - name: after
          in: query
          required: false
          description: A note ref (`N<n>`) or id. The page starts after it.
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/notes/{ref}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Read a note
      description: >-
        Reads one note, with its body, by `N<n>` ref or ULID in either letter case. 404 for none.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/NoteRef"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/cursors/{stream}:
    put:
      operationId: putCursor
      tags: [notes]
      summary: Set a read cursor
      description: >-
        Sets the caller's read cursor on a stream, `notes` or `events`, to `position`: a note ULID or `N<n>` ref for
        `notes`, an event ULID or `E<n>` ref for `events` (either letter case). The cursor then holds that item's ULID
        and `since=cursor` on the stream's list reads the items after it. A stream other than those two is 404 and a
        position that names no note or event (or is not readable) is 400.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: stream
          in: path
          required: true
          description: "`notes` or `events`."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CursorSet"
      responses:
        "200":
          description: The cursor as set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/now:
    get:
      operationId: getNow
      tags: [leases]
      summary: Check in
      description: >-
        The check-in bundle of the caller. After expiring the leases that are due it answers the `actor`, `my_leases`
        (the caller's live leases, each with its task ref, `title` and `expires_at`), `others_leases` (the live leases
        of other actors) and `conflicts`: the live leases that hold a resource of one of the caller's live leases, and
        those of other actors that hold one of the `resources` given, each with only the shared resources. `my_asks`
        holds the asks the caller raised that are open, and those answered since the caller's `notes` cursor or in the
        last 24 hours (the later of the two limits reaches further back), each with its answer. `notes` holds the
        notes after the caller's `notes` cursor that are on a task the caller holds a live lease on, on a resource of
        one of its live leases, mention its handle, or are broadcasts: at most 20 summaries, oldest first, and
        `notes_more` is how many more there are. `attention` is the count of each attention section of the whole
        board (`GET /api/v1/attention?fields=counts`). Reading it moves no cursor. `resources` is a comma-separated
        list of at most 20 resources of 1 to 100 characters, to check before starting.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: resources
          in: query
          required: false
          description: Comma-separated resources to check for conflicts before starting.
          schema:
            type: string
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Now"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/start:
    post:
      operationId: start
      tags: [composite]
      summary: Start working on a task, or on a new one
      description: >-
        Starts the caller's lease and answers the lease, its `conflicts`, the caller's check-in as `now`, the server's
        agent `protocol` version and the caller's `protocol_seen`. Send `task` (a ref or ULID) to start or renew a lease
        on an existing task, or `new_task` (an `initiative` slug or ULID and a `title`) to create the task and start
        the lease on it; exactly one of the two. `intent`, `ttl_seconds` and `resources` are those of
        `POST /api/v1/leases`: the intent is 1 to 200 characters, `ttl_seconds` is clamped to 60 to 43200 and defaults to
        7200, and `resources` is at most 20 strings of 1 to 100 characters. The task, the lease and their events
        (`task_created` with `lease_started`, or `lease_renewed` alone) are written in one transaction, and a request
        that is refused writes nothing. The answer is 201 for a new lease (and for a new task) and 200 when the caller
        already held a live lease on the task and it was renewed. A live lease of another actor that holds one of the
        resources is not a refusal: the lease is written and `conflicts` lists it. A done or closed task, and a
        `new_task` in a closed initiative, are 409 with nothing written. An unknown task or initiative is 404, and a
        request with both or neither of `task` and `new_task` is 400.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          description: The caller already held a live lease on the task, and it was renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResult"
        "201":
          description: A new lease was started, on a new task or an existing one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/finish:
    post:
      operationId: finish
      tags: [composite]
      summary: Finish working on a task
      description: >-
        Ends the caller's live lease on a task, writes `outcome` as a note on the task and, with `done`, marks the task
        done, in one transaction with their events (`lease_ended`, `note_posted` and, with `done`, `task_done`). Send
        `task` (a ref or ULID) to name the task; leave it out to finish the only task the caller holds a live lease on.
        `outcome` is 1 to 200 characters on one line, and is both the lease's outcome and the note's summary. The answer
        is 200 with the ended `lease`, the `note` and `done`. The caller holding no live lease on the given task, no live
        lease at all when `task` is left out, or several live leases when it is left out (the `next` lists them), is
        409; so is `done` while another actor holds a live lease on the task. A 409 writes nothing: neither the lease
        end, nor the note, nor the status. An unknown task is 404, and a missing or malformed `outcome` is 400.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishRequest"
      responses:
        "200":
          description: The lease ended and the note was written, and the task was marked done when `done` was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/ping:
    post:
      operationId: ping
      tags: [composite]
      summary: Renew every live lease the caller holds
      description: >-
        Renews every live lease the caller holds, each to now plus its own ttl, in one transaction with their
        `lease_renewed` events. With `progress` (1 to 200 characters) it also writes one milestone with that summary on
        each leased task (a `milestone` event each), in the same transaction. The answer is 200 with the renewed `leases`,
        oldest first, and `milestones`, the refs of the tasks it wrote a milestone on (empty without `progress`). The
        caller holding no live lease is 409; it writes nothing. A `progress` that is empty or longer than 200 characters is
        400, and writes nothing either.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingRequest"
      responses:
        "200":
          description: Every live lease of the caller was renewed, and a milestone written on each leased task when `progress` was sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/catchup:
    post:
      operationId: catchup
      tags: [composite]
      summary: Read what happened since the caller last caught up
      description: >-
        Answers the notes after the caller's `notes` cursor (the notes `GET /api/v1/notes?since=cursor&ack=true` reads: every
        note, summaries without bodies, oldest first, at most 100 of them) and moves the cursor to the last one returned,
        plus the `answers`: the asks the caller raised that were answered since its previous catch-up, oldest first, each
        with its answer (in the 24 hours before the call when the caller never caught up before). `notes_more` is how many
        notes there are after the ones returned; the next call returns them. It is a POST because it moves a cursor. The
        cursor move and the `catchup` event are one transaction; a call that returns nothing writes nothing, and a second
        call straight after returns nothing. The `catchup` event (summary `catch-up: <n> notes, <m> answers`, `data`
        `{notes, answers, answers_through}`) records the previous catch-up.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The notes since the caller's cursor, now acknowledged, and the answers to its asks since the previous catch-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatchupResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/attention:
    get:
      operationId: getAttention
      tags: [attention]
      summary: What needs attention
      description: >-
        The five sections of what needs the operator, each newest relevant first and each item carrying the actors
        involved (`handle` and `way_back`): `open_asks`, `done_not_closed` (tasks marked done and not closed),
        `expired_leases` (expired, not acknowledged, and with no later lease on the task), `overdue_watches` (open
        watches whose `next_check_at` is past) and `conflicts` (a resource that two or more live leases hold). `counts`
        is the size of each section and `total`, their sum. After expiring the leases that are due the sections are
        judged at one instant. `initiative` (slug or ULID, repeatable: any of them) and `tag` (repeatable: all of them
        must match) keep the items on a task or ask that matches: a task matches a tag as its own tag, its initiative's or a
        derived actor-kind tag, and an ask on no task matches only by its initiative's tags; an ask on no
        initiative is left out when either is given. An `initiative` that names nothing is 404 and a malformed `tag` is
        400. `fields=counts` answers only `counts`, and `fields=full` (the default) the sections too; any other `fields`
        is 400. An empty board counts 0 everywhere.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: initiative
          in: query
          required: false
          description: Keep items on this initiative (slug or ULID). Repeatable; an item on any of them is kept.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: tag
          in: query
          required: false
          description: Keep items on a task that matches this tag as its own, its initiative's or a derived actor-kind tag. Repeatable; every tag given must match (AND).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: fields
          in: query
          required: false
          description: "`full` (the default) answers the sections and the counts, `counts` only the counts."
          schema:
            type: string
      responses:
        "200":
          description: The sections, or only the counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attention"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/attention/now:
    get:
      operationId: getAttentionNow
      tags: [attention]
      summary: What the Now view shows, in one read
      description: >-
        One read for the Now view (not `GET /api/v1/now`, the agent check-in). `attention` is the answer of
        `GET /api/v1/attention` (the five sections and their counts); `in_flight` is every task that has a live lease,
        each with its live leases (holder, intent, expiry), the one whose lease started last first; `recent` is every task
        with no live lease whose last event is within `window` of the call, each with that last event, the latest first.
        A task with a live lease is never in `recent`. Leases that ran out are expired first and everything is judged at
        one instant. The read takes a constant number of queries whatever the size of the store. `initiative` and `tag`
        narrow all three parts as they do on `GET /api/v1/attention`. `window` is `8h`, `24h` (the default) or `3d`; any
        other value is 400 and nothing is changed.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: window
          in: query
          required: false
          description: How far back a task's last event may be for it to be recently touched. Default `24h`.
          schema:
            $ref: "#/components/schemas/NowWindow"
        - name: initiative
          in: query
          required: false
          description: Keep items on this initiative (slug or ULID). Repeatable; an item on any of them is kept.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: tag
          in: query
          required: false
          description: Keep items on a task that matches this tag as its own, its initiative's or a derived actor-kind tag. Repeatable; every tag given must match (AND).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        "200":
          description: The attention sections, the tasks in flight and the recently touched tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttentionNow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Describe the server and the caller
      description: >-
        The server's version, the agent protocol version its binary embeds (the one
        `vh help agent` prints), and who the caller is: the principal that
        authenticated and the actor it acts as. Reads nothing from the database.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The server and the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/actors/me/protocol-seen:
    put:
      operationId: putProtocolSeen
      tags: [meta]
      summary: Record that the calling actor has read an agent protocol version
      description: >-
        Sets the calling actor's `protocol_seen` to `version` when that is higher than
        what is recorded (the column holds the highest version read, so repeating a call,
        or sending an older version, changes nothing) and upserts the actor. A negative
        `version` is 400.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProtocolSeenRequest"
      responses:
        "200":
          description: The actor with the highest protocol version it has read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtocolSeen"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/actors:
    get:
      operationId: listActors
      tags: [actors]
      summary: List the actors
      description: >-
        Every actor the board has recorded, the one seen last first (`last_seen`, newest first; ties by handle), each with
        its live leases (`ref`, `task`, `intent`, `expires_at`, `resources`) and its open asks. A lease whose time has run
        out is expired before the read and is not listed. `alive=true` keeps only the actors that hold a live lease; left
        out or false, every actor is listed. A `alive` that is not a boolean is 400.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: alive
          in: query
          required: false
          description: When true, keep only the actors that hold a live lease.
          schema:
            type: boolean
      responses:
        "200":
          description: The actors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/actors/{handle}:
    get:
      operationId: getActor
      tags: [actors]
      summary: Read one actor
      description: >-
        The actor with this handle, with its `way_back`, `last_seen`, live leases and open asks, as `GET /api/v1/actors`
        lists it. A handle that names no actor is 404.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          description: The actor's handle.
          schema:
            type: string
      responses:
        "200":
          description: The actor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/login:
    get:
      operationId: getAuthLogin
      tags: [auth]
      summary: Start the browser login
      description: >-
        A browser navigation (a GET that accepts `text/html`) is redirected to the
        identity provider's authorization endpoint with PKCE (S256), `state` and
        `nonce`, and gets a short-lived HttpOnly pre-login cookie. Any other
        request with no credential is an API call and gets 401.
      security: []
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              description: The provider's authorization endpoint with the login's parameters.
              schema:
                type: string
            Set-Cookie:
              description: The pre-login cookie `board_login`, HttpOnly, Secure, SameSite=Lax, valid 10 minutes.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          description: >-
            Any status not listed here is a problem document. A login never answers
            2xx: it ends in a redirect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/oidc/callback:
    get:
      operationId: getAuthOidcCallback
      tags: [auth]
      summary: Finish the browser login
      description: >-
        The fixed redirect URI registered with the identity provider, called with the
        query parameters `code`, `state` and, when the provider refused the login,
        `error`, and the pre-login cookie `board_login`. It spends the
        login's `state`, `nonce` and PKCE verifier, checks the ID token, admits only
        a verified email on the allowed list, and starts the session. Like
        `/auth/login` it answers a browser navigation, and any other request with
        no credential gets 401.
      security: []
      responses:
        "302":
          description: The login succeeded. Redirects to `/` and sets the session cookie `board_session`.
          headers:
            Location:
              description: Where the browser lands.
              schema:
                type: string
            Set-Cookie:
              description: The session cookie, HttpOnly, Secure, SameSite=Lax.
              schema:
                type: string
        "400":
          description: >-
            The callback does not belong to a login in progress (no pre-login
            cookie and so no PKCE verifier, `state` mismatch, no code) or the ID
            token carries another login's `nonce`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        default:
          description: >-
            Any status not listed here is a problem document. A login never answers
            2xx: it ends in a redirect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: The caller's browser session
      description: >-
        Describes the session the cookie names: the principal, the actor it acts
        as (the operator handle of its email), and the session's CSRF token.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/logout:
    post:
      operationId: postAuthLogout
      tags: [auth]
      summary: End the browser session
      description: Deletes the session server-side and clears the cookie. A cookie-authenticated write needs the X-CSRF-Token header and a same-origin Origin (SPEC 3.2), or the request is refused with 403 before it runs.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: The session is ended.
          headers:
            Set-Cookie:
              description: The session cookie, cleared.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key minted by `vh admin keys create`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: board_session
      description: The operator's browser session.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Makes the write safe to retry. 1 to 255 printable ASCII characters (anything else is 400), scoped to the
        caller's principal. Within 24 hours the same method, path, query, actor and body sent again with the key is
        answered with the first request's status and body plus the header `Idempotent-Replayed: true`, and writes
        nothing. The same key with a different request is 422. A duplicate that arrives while the first is still
        running is 409. A key older than 24 hours counts as new. A 5xx answer is not stored, so the retry runs
        again. Without the header the request runs as it always did.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    TaskRef:
      name: ref
      in: path
      required: true
      description: The task's ref (`<initiative slug>-<seq>`) or ULID, in either letter case.
      schema:
        type: string
    BlockedByRef:
      name: blockedByRef
      in: path
      required: true
      description: The ref or ULID, in either letter case, of the task that blocks.
      schema:
        type: string
    TaskTag:
      name: tag
      in: path
      required: true
      description: One tag of the task's own, in either letter case; it is trimmed and lowercased.
      schema:
        type: string
    LeaseRef:
      name: ref
      in: path
      required: true
      description: The lease's ref (`L<n>`, either letter case) or ULID.
      schema:
        type: string
    AskRef:
      name: ref
      in: path
      required: true
      description: The ask's ref (`A<n>`, either letter case) or ULID.
      schema:
        type: string
    NoteRef:
      name: ref
      in: path
      required: true
      description: The note's ref (`N<n>`, either letter case) or ULID.
      schema:
        type: string
    EventLimit:
      name: limit
      in: query
      required: false
      description: The page size, 1 to 1000. Default 100.
      schema:
        type: integer
    EventAfter:
      name: after
      in: query
      required: false
      description: An event id or `E<n>` ref. The page starts after it.
      schema:
        type: string
  responses:
    BadRequest:
      description: >-
        A valid key was presented without a `Board-Actor` header or with a
        `Board-Actor-Meta` header that is not a JSON object, or the request
        body or a parameter is not acceptable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No credential, or an unknown, revoked or expired key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: There is no such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with what exists, such as a name already taken.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: >-
        The `Idempotency-Key` was first used with a different request (a different method, path, query, actor or
        body). Send a new key for a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The lease has expired. The problem carries `expired_at`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The account may not log in.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: The identity provider could not be reached or refused the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: The service cannot take the request right now.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Key:
      type: object
      description: An API key as the board stores it. It never holds the key itself.
      required: [id, name, display_prefix, status, created_at, created_by]
      properties:
        id:
          type: string
          description: The key's ULID.
        name:
          type: string
          description: The key's unique name, such as `workstation`.
        display_prefix:
          type: string
          description: The 8 characters after `brd_`, which tell keys apart.
        status:
          type: string
          enum: [active, expired, revoked]
          description: The key's state now.
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          description: The principal that created the key, `key:<name>` or `oidc:<email>`, or `admin-cli`.
        owner:
          type: string
          description: |-
            The handle of the operator actor that owns the key: the session's operator for a key made through a
            session, the creating key's owner for one made through a key, the `--owner` of `vh admin keys create`.
            Absent when no operator was known when the key was made. Nothing checks it.
        last_used_at:
          type: string
          format: date-time
          description: When the key was last used, to within 30 seconds. Absent when it never was.
        expires_at:
          type: string
          format: date-time
          description: When the key stops working. Absent for a key that does not expire.
        revoked_at:
          type: string
          format: date-time
          description: When the key was revoked. Absent for a key that was not.
    KeyList:
      type: object
      description: The API keys.
      required: [items]
      properties:
        items:
          type: array
          description: Every key, oldest first.
          items:
            $ref: "#/components/schemas/Key"
    KeyCreate:
      type: object
      description: A new API key.
      required: [name]
      properties:
        name:
          type: string
          description: 1-64 characters of a-z, A-Z, 0-9, `.`, `_` or `-`, starting with a letter or digit. Unique.
        expires_in:
          type: string
          description: A positive count of days or hours, like `90d` or `12h`, at most 36500 days. Omitted, the key does not expire.
          examples: [90d]
    CreatedKey:
      description: A key just created. `key` is shown this once.
      allOf:
        - $ref: "#/components/schemas/Key"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The API key, `brd_` and 52 characters. Never returned again.
    Initiative:
      type: object
      description: An initiative with its tags.
      required: [id, ref, slug, title, description, status, tags, created_by, created_at]
      properties:
        id:
          type: string
          description: The initiative's ULID.
        ref:
          type: string
          description: The short ref, which is the slug.
        slug:
          type: string
          description: The unique slug, 2 to 40 characters of `a-z`, `0-9` and `-`.
          examples: [phone-onboard]
        title:
          type: string
        description:
          type: string
          description: Markdown. Empty when none was given.
        status:
          type: string
          enum: [open, closed]
        tags:
          type: array
          description: The tags, sorted.
          items:
            type: string
        target_start:
          type: string
          format: date
          description: The planned start. Absent when none was given.
        target_end:
          type: string
          format: date
          description: The planned end. Absent when none was given.
        created_by:
          type: string
          description: The handle of the actor that created it.
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          description: When it was closed. Absent while it is open.
        closed_by:
          type: string
          description: The handle of the actor that closed it. Absent while it is open.
    InitiativeAttentionCount:
      type: integer
      minimum: 0
      description: >-
        How many of the initiative's tasks have a non-empty `attention` list (stranded, asking or done and not
        closed). A task counts once however many reasons it has.
    InitiativeDetail:
      description: An initiative with the number of its tasks that need attention.
      allOf:
        - $ref: "#/components/schemas/Initiative"
        - type: object
          required: [attention_count]
          properties:
            attention_count:
              $ref: "#/components/schemas/InitiativeAttentionCount"
    InitiativeListItem:
      description: An initiative of a list, with the counts of its tasks and its live leases.
      allOf:
        - $ref: "#/components/schemas/Initiative"
        - type: object
          required: [counts, live_leases, attention_count]
          properties:
            attention_count:
              $ref: "#/components/schemas/InitiativeAttentionCount"
            counts:
              $ref: "#/components/schemas/TaskCounts"
            live_leases:
              type: integer
              description: How many live leases sit on the initiative's tasks.
    TaskCount:
      type: object
      description: How many tasks a filter keeps.
      required: [count]
      properties:
        count:
          type: integer
          description: The number of tasks kept, 0 for none.
    TaskCounts:
      type: object
      description: How many tasks an initiative holds in each status.
      required: [open, done, closed]
      properties:
        open:
          type: integer
        done:
          type: integer
        closed:
          type: integer
    InitiativeList:
      type: object
      description: A page of initiatives.
      required: [items]
      properties:
        items:
          type: array
          description: The initiatives of the page, ordered by id.
          items:
            $ref: "#/components/schemas/InitiativeListItem"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    InitiativeCreate:
      type: object
      description: A new initiative.
      required: [slug, title]
      properties:
        slug:
          type: string
          description: 2 to 40 characters of `a-z`, `0-9` and `-`. Unique.
          examples: [phone-onboard]
        title:
          type: string
          description: 1 to 200 characters.
        description:
          type: string
          description: Markdown, at most 20000 characters.
        tags:
          type: array
          description: >-
            At most 20 tags, each lowercase letters, digits, `.`, `_`, `:` or `-`, starting with a letter or
            digit, at most 40 characters. Trimmed, lowercased and deduplicated.
          items:
            type: string
        target_start:
          type: string
          format: date
        target_end:
          type: string
          format: date
          description: Not before `target_start`.
    InitiativePatch:
      type: object
      description: >-
        The fields to change. A field left out keeps its value. `null` clears `target_start` and `target_end`,
        and is 400 for the others.
      properties:
        title:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: 1 to 200 characters.
        description:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Markdown, at most 20000 characters.
        tags:
          type: [array, "null"]
          x-go-type: Maybe[[]string]
          x-go-type-skip-optional-pointer: true
          description: Replaces the set. At most 20 tags, normalised as for a create.
          items:
            type: string
        target_start:
          type: [string, "null"]
          format: date
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
        target_end:
          type: [string, "null"]
          format: date
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Not before `target_start`.
        slug:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
    ExternalRef:
      type: object
      description: A link to a ticket, pull request or build.
      required: [label, url]
      properties:
        label:
          type: string
          description: 1 to 80 characters.
        url:
          type: string
          description: An `http` or `https` URL.
    TaskLink:
      type: object
      description: A task on the other end of a dependency, with its tags as every task read shape gives them.
      required: [ref, title, status, tags, tag_marks]
      properties:
        ref:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [open, done, closed]
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows with its source, as for `Task`: its own, then its initiative's, then the derived
            actor-kind tags.
          items:
            $ref: "#/components/schemas/TagMark"
    Lease:
      type: object
      description: A lease on a task, with its resources.
      required: [id, ref, task, actor, intent, ttl_seconds, started_at, renewed_at, expires_at, state, resources]
      properties:
        id:
          type: string
          description: The lease's ULID.
        ref:
          type: string
          description: The short ref, `L<n>`.
        task:
          type: string
          description: The ref of the task it is on.
        actor:
          type: string
          description: The handle of the actor that holds it.
        intent:
          type: string
        ttl_seconds:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        renewed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [live, ended, expired]
        resources:
          type: array
          description: The resources it holds, sorted.
          items:
            type: string
        ended_at:
          type: string
          format: date-time
        ended_by:
          type: string
          description: The handle of the actor that ended it, when that was not the holder.
        outcome:
          type: string
        acked_at:
          type: string
          format: date-time
        acked_by:
          type: string
    Task:
      type: object
      description: A task. `active`, `blocked` and `overdue` are derived. `tags` are the task's own tags.
      required: [id, ref, initiative, seq, title, description, kind, status, external_refs, tags, tag_marks, created_by,
                 created_at, updated_at, active, blocked, overdue]
      properties:
        id:
          type: string
          description: The task's ULID.
        ref:
          type: string
          description: The short ref, `<initiative slug>-<seq>`.
          examples: [phone-onboard-3]
        initiative:
          type: string
          description: The slug of the initiative it belongs to.
        seq:
          type: integer
          description: The number within the initiative, from 1.
        title:
          type: string
        description:
          type: string
          description: Markdown. Empty when none was given.
        kind:
          type: string
          enum: [work, watch]
        status:
          type: string
          enum: [open, done, closed]
        resolution:
          type: string
          enum: [completed, dropped, superseded, duplicate]
          description: Why it was closed. Absent unless it is closed.
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        cadence_seconds:
          type: integer
          format: int64
          description: Watch tasks only.
        next_check_at:
          type: string
          format: date-time
          description: Watch tasks only.
        external_refs:
          type: array
          items:
            $ref: "#/components/schemas/ExternalRef"
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows, each marked with where it comes from: the task's own tags, then its initiative's,
            then the derived actor-kind tags, each source's tags in order (actor kinds in the order `ralph`, `claude`,
            `pi`, `codex`, `deck`). A tag that has two sources appears once for each. Derived tags are computed on
            read, are never stored and are not in `tags`.
          items:
            $ref: "#/components/schemas/TagMark"
        created_by:
          type: string
          description: The handle of the actor that created it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        done_at:
          type: string
          format: date-time
        done_by:
          type: string
        closed_at:
          type: string
          format: date-time
        closed_by:
          type: string
        active:
          type: boolean
          description: It has a live lease.
        blocked:
          type: boolean
          description: It has an open dependency, one whose blocking task is not closed.
        overdue:
          type: boolean
          description: A watch task, not closed, whose `next_check_at` is before now.
    TagSources:
      type: object
      description: The sources each tag has on the tasks a filter keeps, keyed by tag.
      additionalProperties:
        type: array
        description: The sources of the tag, in the order task, initiative, actor; never empty.
        items:
          type: string
          enum: [task, initiative, actor]
    TagMark:
      type: object
      description: One tag of a task and its source.
      required: [tag, source]
      properties:
        tag:
          type: string
        source:
          type: string
          enum: [task, initiative, actor]
          description: >-
            `task`: one of the task's own tags. `initiative`: a tag of its initiative. `actor`: derived, the kind
            (`ralph`, `claude`, `pi`, `codex` or `deck`) of the holder of a live or ended lease on it, the holder's
            handle prefix before the first `:`.
    TaskDetail:
      description: A task with its dependencies and live leases.
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [deps, blocking, live_leases, open_asks, attention]
          properties:
            attention:
              type: array
              description: >-
                Why the task needs a person, in the order stranded, asking, done. Empty when it needs nothing, and always
                empty for a closed task.
              items:
                $ref: "#/components/schemas/TaskAttention"
            stranded_lease:
              $ref: "#/components/schemas/TaskStrandedLease"
            deps:
              type: array
              description: The tasks it is blocked by, in creation order.
              items:
                $ref: "#/components/schemas/TaskLink"
            blocking:
              type: array
              description: The tasks that are blocked by it, in creation order.
              items:
                $ref: "#/components/schemas/TaskLink"
            live_leases:
              type: array
              description: Its live leases, oldest first.
              items:
                $ref: "#/components/schemas/Lease"
            open_asks:
              type: array
              description: >-
                Its open asks, blocking or not, oldest first. While one of them is blocking, `blocked` is true.
              items:
                $ref: "#/components/schemas/Ask"
    TaskListItem:
      description: A task of a list, with its live leases.
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [live_leases, attention]
          properties:
            attention:
              type: array
              description: >-
                Why the task needs a person, in the order stranded, asking, done. Empty when it needs nothing, and always
                empty for a closed task.
              items:
                $ref: "#/components/schemas/TaskAttention"
            stranded_lease:
              $ref: "#/components/schemas/TaskStrandedLease"
            live_leases:
              type: array
              description: Its live leases, oldest first.
              items:
                $ref: "#/components/schemas/Lease"
    TaskAttention:
      type: object
      description: One reason a task needs a person.
      required: [reason]
      properties:
        reason:
          type: string
          enum: [stranded, asking, done]
          description: >-
            `stranded`: its newest lease ran out and nobody acknowledged it. `asking`: it has an open ask. `done`: it is
            done and not closed.
        blocking:
          type: boolean
          description: Present, and true, on `asking` when an open ask is blocking.
        asker_waiting:
          type: boolean
          description: Present, and true, on `asking` when an open ask has its asker waiting.
    TaskStrandedLease:
      type: object
      description: The lease behind the `stranded` reason. Present only on a stranded task.
      required: [ref, holder, intent, renewed_at, expired_at]
      properties:
        ref:
          type: string
          description: The lease's ref, `L<n>`.
        holder:
          $ref: "#/components/schemas/AttentionActor"
        intent:
          type: string
        renewed_at:
          type: string
          format: date-time
        expired_at:
          type: string
          format: date-time
    TaskList:
      type: object
      description: A page of tasks.
      required: [items]
      properties:
        items:
          type: array
          description: The tasks of the page, ordered by id.
          items:
            $ref: "#/components/schemas/TaskListItem"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    TaskCreate:
      type: object
      description: A new task.
      required: [initiative, title]
      properties:
        initiative:
          type: string
          description: The slug or ULID of an open initiative.
        title:
          type: string
          description: 1 to 200 characters.
        description:
          type: string
          description: Markdown, at most 20000 characters.
        kind:
          type: string
          enum: [work, watch]
          description: Default `work`.
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
          description: Not before `planned_start`.
        cadence_seconds:
          type: integer
          format: int64
          description: Watch tasks only, and required there. 60 to 31536000.
        next_check_at:
          type: string
          format: date-time
          description: Watch tasks only. Default now plus `cadence_seconds`.
        external_refs:
          type: array
          description: At most 20.
          items:
            $ref: "#/components/schemas/ExternalRef"
        blocked_by:
          type: array
          description: Refs or ULIDs of the tasks the new task starts out blocked by.
          items:
            type: string
        tags:
          type: array
          description: >-
            At most 20 tags, each lowercase letters, digits, `.`, `_`, `:` or `-`, starting with a letter or
            digit, at most 40 characters. Trimmed, lowercased and deduplicated (the initiative tag rule).
          items:
            type: string
    InitiativeClose:
      type: object
      properties:
        force:
          type: boolean
          description: >-
            Close the tasks that are not closed as `dropped` and then the initiative. Without it, an initiative with
            such a task is not closed.
          examples: [true]
    TaskDone:
      type: object
      properties:
        outcome:
          type: string
          description: >-
            Optional, at most 200 characters. The outcome the caller's own live lease on the task ends with; `done`
            when left out. Not used with `force`, which ends every lease with the forced outcome.
          examples: [shipped]
        force:
          type: boolean
          description: >-
            Optional, false when left out. Ends every live lease on the task, the caller's own included, with
            `ended_by` the caller and outcome `ended: task marked done by <handle>`, instead of refusing with 409 on
            another actor's lease. The operator's action: agents send it only when the operator says so.
          examples: [false]
    TaskClose:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          description: Required. Why the task is closed. One of `completed`, `dropped`, `superseded` or `duplicate`.
          examples: [completed]
    TaskCheck:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: Required, 1 to 200 characters. What the check found.
        next_check_at:
          type: string
          format: date-time
          description: When the next check is due. Default is now plus the task's cadence.
    TaskMilestone:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          description: Required, 1 to 200 characters.
        data:
          type: object
          additionalProperties: true
          description: Anything to record with the milestone, kept under the event's `data.data`.
    Event:
      type: object
      description: One row of the audit trail.
      required: [id, ref, at, type, actor, principal, summary, data]
      properties:
        id:
          type: string
          description: The event's ULID.
        ref:
          type: string
          description: The short ref `E<n>`.
          examples: [E42]
        at:
          type: string
          format: date-time
        type:
          type: string
          examples: [task_done]
        actor:
          type: string
          description: The handle of the actor the event was written as.
        principal:
          type: string
          description: The principal that authenticated.
        origin:
          type: string
          description: |-
            The handle of the operator actor behind the write: a session's own operator, or the owner of the key
            the write came through. Fixed when the event is written, whatever the actor's origin becomes later.
            Absent when no operator was known.
        initiative:
          type: string
          description: The slug of the initiative the event names. Absent when it names none.
        task:
          type: string
          description: The ref of the task the event names. Absent when it names none.
        ref_id:
          type: string
          description: The id of the object the event is about. Absent when it has none.
        summary:
          type: string
          description: A one-line description.
        data:
          type: object
          additionalProperties: true
    LeaseStart:
      type: object
      description: The lease to start.
      required: [task, intent]
      properties:
        task:
          type: string
          description: The task's ref or ULID.
        intent:
          type: string
          description: One line on what the actor is doing, 1 to 200 characters.
        ttl_seconds:
          type: integer
          format: int64
          description: Clamped to 60 to 43200. Default 7200.
        resources:
          type: array
          description: At most 20 strings of 1 to 100 characters, repeats dropped.
          items:
            type: string
    LeaseRenew:
      type: object
      description: What to change on a renewal. A field left out keeps its value.
      properties:
        ttl_seconds:
          type: integer
          format: int64
          description: Clamped to 60 to 43200. Left out keeps the lease's ttl.
        intent:
          type: string
        resources:
          type: array
          items:
            type: string
    LeaseEnd:
      type: object
      description: How the lease ended.
      properties:
        outcome:
          type: string
          description: At most 200 characters.
    LeaseConflict:
      type: object
      description: A live lease of another that holds a resource of the one asked about.
      required: [lease, holder, task, intent, expires_at, resources]
      properties:
        lease:
          type: string
          description: The conflicting lease's ref, `L<n>`.
        holder:
          type: string
          description: The handle of the actor that holds it.
        task:
          type: string
          description: The ref of the task it is on.
        intent:
          type: string
        expires_at:
          type: string
          format: date-time
        resources:
          type: array
          description: The resources both leases hold.
          items:
            type: string
    LeaseResult:
      type: object
      description: A lease with the live leases of others that conflict with it.
      required: [lease, conflicts]
      properties:
        lease:
          $ref: "#/components/schemas/Lease"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/LeaseConflict"
    StartNewTask:
      type: object
      description: The task a start creates and starts on.
      required: [initiative, title]
      properties:
        initiative:
          type: string
          description: The slug or ULID of an open initiative.
        title:
          type: string
          description: 1 to 200 characters.
        tags:
          type: array
          description: >-
            At most 20 tags, each lowercase letters, digits, `.`, `_`, `:` or `-`, starting with a letter or
            digit, at most 40 characters. Trimmed, lowercased and deduplicated (the initiative tag rule).
          items:
            type: string
    StartRequest:
      type: object
      description: The lease to start, on an existing task (`task`) or on a task it creates (`new_task`).
      required: [intent]
      properties:
        task:
          type: string
          description: The existing task's ref or ULID. Not with `new_task`.
        new_task:
          $ref: "#/components/schemas/StartNewTask"
        intent:
          type: string
          description: One line on what the actor is doing, 1 to 200 characters.
        ttl_seconds:
          type: integer
          format: int64
          description: Clamped to 60 to 43200. Default 7200.
        resources:
          type: array
          description: At most 20 strings of 1 to 100 characters, repeats dropped.
          items:
            type: string
    StartResult:
      type: object
      description: >-
        A lease with the live leases of others that conflict with it, the caller's check-in after the write, and the
        agent protocol versions.
      required: [lease, conflicts, task_created, now, protocol, protocol_seen]
      properties:
        lease:
          $ref: "#/components/schemas/Lease"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/LeaseConflict"
        task_created:
          type: boolean
          description: True when the request created the task (`new_task`).
        now:
          $ref: "#/components/schemas/Now"
        protocol:
          type: integer
          description: The agent protocol version the server binary embeds.
        protocol_seen:
          type: integer
          description: The highest agent protocol version the caller has read, 0 when it has recorded none.
    FinishRequest:
      type: object
      description: The lease to end, the outcome to record and whether the task is done.
      required: [outcome]
      properties:
        task:
          type: string
          description: The task's ref or ULID. Left out, the caller's only live lease names the task.
        outcome:
          type: string
          description: What was done or where it was left, 1 to 200 characters on one line. The lease's outcome and the note's summary.
        done:
          type: boolean
          description: Also mark the task done. Default false.
    FinishResult:
      type: object
      description: The lease the finish ended, the note it wrote and whether it marked the task done.
      required: [lease, note, done]
      properties:
        lease:
          $ref: "#/components/schemas/Lease"
        note:
          $ref: "#/components/schemas/Note"
        done:
          type: boolean
          description: True when the request marked the task done.
    CatchupResult:
      type: object
      description: What a catch-up read, the notes it acknowledged and the answers it delivered.
      required: [notes, notes_more, answers]
      properties:
        notes:
          type: array
          description: The notes after the caller's cursor, summaries without bodies, oldest first; the cursor now sits on the last one.
          items:
            $ref: "#/components/schemas/Note"
        notes_more:
          type: integer
          description: How many notes there are after the ones returned, which the next call returns.
        answers:
          type: array
          description: The caller's asks that were answered since its previous catch-up, oldest first, each with its answer.
          items:
            $ref: "#/components/schemas/Ask"
    PingRequest:
      type: object
      description: The progress to record on each leased task.
      properties:
        progress:
          type: string
          description: What has been done so far, 1 to 200 characters. Left out, the leases are only renewed.
    PingResult:
      type: object
      description: The leases the ping renewed and the tasks it wrote a milestone on.
      required: [leases, milestones]
      properties:
        leases:
          type: array
          description: The renewed leases, oldest first.
          items:
            $ref: "#/components/schemas/Lease"
        milestones:
          type: array
          description: The refs of the tasks a milestone was written on, one for each leased task. Empty without `progress`.
          items:
            type: string
    NowLease:
      description: One of the caller's live leases, with the title of its task.
      allOf:
        - $ref: "#/components/schemas/Lease"
        - type: object
          required: [title]
          properties:
            title:
              type: string
              description: The title of the lease's task.
    Now:
      type: object
      description: The caller's check-in.
      required: [actor, my_leases, others_leases, conflicts, my_asks, notes, notes_more, attention]
      properties:
        actor:
          type: string
          description: The handle of the caller's actor.
        my_leases:
          type: array
          description: The caller's live leases, oldest first.
          items:
            $ref: "#/components/schemas/NowLease"
        others_leases:
          type: array
          description: The live leases of other actors, oldest first.
          items:
            $ref: "#/components/schemas/Lease"
        conflicts:
          type: array
          description: >-
            The live leases that hold a resource of one of the caller's live leases, and the live leases of other actors
            that hold one of the resources asked about, in lease-number order, each once.
          items:
            $ref: "#/components/schemas/LeaseConflict"
        my_asks:
          type: array
          description: >-
            The asks the caller raised that are open, and those answered since its `notes` cursor or in the last 24
            hours, oldest first.
          items:
            $ref: "#/components/schemas/Ask"
        notes:
          type: array
          description: >-
            The notes after the caller's `notes` cursor that concern it (on a task it holds a live lease on, on a
            resource of one of its live leases, mentioning it, or a broadcast): at most 20, oldest first, without bodies.
          items:
            $ref: "#/components/schemas/Note"
        notes_more:
          type: integer
          description: How many more notes concern the caller after the ones listed.
        attention:
          $ref: "#/components/schemas/AttentionCounts"
    AttentionActor:
      type: object
      description: An actor involved in an item, with the way back the board has on record for it.
      required: [handle]
      properties:
        handle:
          type: string
        way_back:
          type: string
          description: How to reach the actor again. Absent when the board has none.
    AttentionCounts:
      type: object
      description: The size of each section and their sum.
      required: [open_asks, done_not_closed, expired_leases, overdue_watches, conflicts, total]
      properties:
        open_asks:
          type: integer
        done_not_closed:
          type: integer
        expired_leases:
          type: integer
        overdue_watches:
          type: integer
        conflicts:
          type: integer
        total:
          type: integer
          description: The sum of the five sections.
    AttentionAsk:
      type: object
      description: An open ask.
      required: [ref, question, asker, mode, asker_waiting, blocking, created_at, age_seconds]
      properties:
        ref:
          type: string
          description: The ask's ref, `A<n>`.
        question:
          type: string
        task:
          type: string
          description: The ref of the task the ask is on. Absent for an ask on no task.
        initiative:
          type: string
          description: The slug of the initiative the ask belongs to, through its task or raised on the initiative directly. Absent for a global ask.
        asker:
          $ref: "#/components/schemas/AttentionActor"
        mode:
          type: string
          enum: [stop, poll]
        asker_waiting:
          type: boolean
          description: For a `poll` ask, whether the asker is still polling; false for a `stop` ask.
        blocking:
          type: boolean
        created_at:
          type: string
          format: date-time
        age_seconds:
          type: integer
          description: Whole seconds since the ask was raised.
    AttentionLastLease:
      type: object
      description: The last ended lease of a task.
      required: [lease, holder, ended_at]
      properties:
        lease:
          type: string
          description: The lease's ref, `L<n>`.
        holder:
          $ref: "#/components/schemas/AttentionActor"
        outcome:
          type: string
          description: What the holder wrote when they ended it. Absent when they wrote nothing.
        ended_at:
          type: string
          format: date-time
    AttentionDoneTask:
      type: object
      description: A task marked done and not yet closed.
      required: [task, title, done_by, done_at, tags, tag_marks]
      properties:
        task:
          type: string
          description: The task's ref.
        title:
          type: string
        done_by:
          $ref: "#/components/schemas/AttentionActor"
        done_at:
          type: string
          format: date-time
        last_lease:
          $ref: "#/components/schemas/AttentionLastLease"
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows with its source, as for `Task`: its own, then its initiative's, then the derived
            actor-kind tags.
          items:
            $ref: "#/components/schemas/TagMark"
    AttentionExpiredLease:
      type: object
      description: A lease that ran out, was not acknowledged and has no later lease on its task.
      required: [lease, holder, task, title, intent, renewed_at, expired_at, tags, tag_marks]
      properties:
        lease:
          type: string
          description: The lease's ref, `L<n>`.
        holder:
          $ref: "#/components/schemas/AttentionActor"
        task:
          type: string
        title:
          type: string
        intent:
          type: string
        renewed_at:
          type: string
          format: date-time
          description: The last renewal of the lease.
        expired_at:
          type: string
          format: date-time
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows with its source, as for `Task`: its own, then its initiative's, then the derived
            actor-kind tags.
          items:
            $ref: "#/components/schemas/TagMark"
    AttentionLastCheck:
      type: object
      description: The latest check recorded on a watch.
      required: [summary, by, at]
      properties:
        summary:
          type: string
        by:
          $ref: "#/components/schemas/AttentionActor"
        at:
          type: string
          format: date-time
    AttentionWatch:
      type: object
      description: An open watch whose next check is due.
      required: [task, title, owner, next_check_at, tags, tag_marks]
      properties:
        task:
          type: string
        title:
          type: string
        owner:
          $ref: "#/components/schemas/AttentionActor"
        next_check_at:
          type: string
          format: date-time
        last_check:
          $ref: "#/components/schemas/AttentionLastCheck"
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows with its source, as for `Task`: its own, then its initiative's, then the derived
            actor-kind tags.
          items:
            $ref: "#/components/schemas/TagMark"
    AttentionHolder:
      type: object
      description: One live lease on a contested resource.
      required: [lease, actor, task, intent, expires_at]
      properties:
        lease:
          type: string
        actor:
          $ref: "#/components/schemas/AttentionActor"
        task:
          type: string
        intent:
          type: string
        expires_at:
          type: string
          format: date-time
    AttentionConflict:
      type: object
      description: A resource that two or more live leases hold.
      required: [resource, holders, tasks, since]
      properties:
        resource:
          type: string
        since:
          type: string
          format: date-time
          description: >-
            When the contest began, that is the newest `started_at` among the live leases that hold the resource.
        holders:
          type: array
          description: Every live lease on the resource, in lease-number order.
          items:
            $ref: "#/components/schemas/AttentionHolder"
        tasks:
          type: array
          description: The distinct tasks of the holders, in the same order.
          items:
            type: string
    Attention:
      type: object
      description: >-
        The five sections and their counts. `fields=counts` leaves the sections out, so `counts` is the only
        member always present.
      required: [counts]
      properties:
        counts:
          $ref: "#/components/schemas/AttentionCounts"
        open_asks:
          type: array
          items:
            $ref: "#/components/schemas/AttentionAsk"
        done_not_closed:
          type: array
          items:
            $ref: "#/components/schemas/AttentionDoneTask"
        expired_leases:
          type: array
          items:
            $ref: "#/components/schemas/AttentionExpiredLease"
        overdue_watches:
          type: array
          items:
            $ref: "#/components/schemas/AttentionWatch"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/AttentionConflict"
    TaskTagMarks:
      type: object
      description: A task's tags, as every task read shape gives them.
      required: [tags, tag_marks]
      properties:
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows with its source, as for `Task`: its own, then its initiative's, then the derived
            actor-kind tags.
          items:
            $ref: "#/components/schemas/TagMark"
    NowWindow:
      type: string
      description: How far back the recently touched tasks of the Now read reach.
      enum: ["8h", "24h", "3d"]
    NowTask:
      type: object
      description: The task a Now item is about.
      required: [task, title, initiative, status, kind, tags, tag_marks]
      properties:
        task:
          type: string
          description: The task's ref, such as `aa-1`.
        title:
          type: string
        initiative:
          type: string
          description: The slug of the task's initiative.
        status:
          type: string
          enum: [open, done, closed]
        kind:
          type: string
          enum: [work, watch]
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows with its source, as for `Task`: its own, then its initiative's, then the derived
            actor-kind tags.
          items:
            $ref: "#/components/schemas/TagMark"
    NowFlightLease:
      type: object
      description: A live lease nested in an in-flight task.
      required: [lease, holder, intent, started_at, renewed_at, expires_at]
      properties:
        lease:
          type: string
          description: The lease's ref, such as `L3`.
        holder:
          $ref: "#/components/schemas/AttentionActor"
        intent:
          type: string
        started_at:
          type: string
          format: date-time
        renewed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    NowInFlight:
      type: object
      description: A task with at least one live lease, with its live leases in lease-number order.
      required: [task, leases]
      properties:
        task:
          $ref: "#/components/schemas/NowTask"
        leases:
          type: array
          items:
            $ref: "#/components/schemas/NowFlightLease"
    NowLastEvent:
      type: object
      description: The last event written on a task.
      required: [type, summary, actor, at]
      properties:
        type:
          type: string
          description: The event type, such as `lease_ended`.
        summary:
          type: string
        actor:
          $ref: "#/components/schemas/AttentionActor"
        origin:
          type: string
          description: |-
            The handle of the operator actor behind the write, as the event recorded it (the `origin` of
            `GET /events`). Fixed when the event is written, whatever the actor's origin becomes later. Absent when
            no operator was known.
        at:
          type: string
          format: date-time
    NowRecent:
      type: object
      description: A task with no live lease whose last event is within the window.
      required: [task, last_event]
      properties:
        task:
          $ref: "#/components/schemas/NowTask"
        last_event:
          $ref: "#/components/schemas/NowLastEvent"
    AttentionNow:
      type: object
      description: The three parts of the Now view, all narrowed by the same filters.
      required: [window, attention, in_flight, recent, task_marks]
      properties:
        window:
          $ref: "#/components/schemas/NowWindow"
        attention:
          $ref: "#/components/schemas/Attention"
        in_flight:
          type: array
          items:
            $ref: "#/components/schemas/NowInFlight"
        recent:
          type: array
          items:
            $ref: "#/components/schemas/NowRecent"
        task_marks:
          type: object
          description: >-
            The tags of every task any part names, keyed by the task's ref: the tasks of the attention items (an ask, a
            done task, an expired lease, a watch, the tasks of a conflict's holders), those in flight and the recent
            ones. A task the three parts do not name is not a key, and neither is an item on no task.
          additionalProperties:
            $ref: "#/components/schemas/TaskTagMarks"
    LeaseList:
      type: object
      description: A page of leases.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Lease"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    Ask:
      type: object
      description: An ask. `asker_waiting` is derived.
      required: [id, ref, asker, question, details, options, mode, blocking, state, created_at, asker_waiting]
      properties:
        id:
          type: string
          description: The ask's ULID.
        ref:
          type: string
          description: The short ref, `A<n>`.
        task:
          type: string
          description: The ref of the task it is on. Absent for an ask on an initiative or board-wide.
        initiative:
          type: string
          description: The slug of the initiative, derived from the task when there is one. Absent for a board-wide ask.
        asker:
          type: string
          description: The handle of the actor that raised it.
        question:
          type: string
          description: One line, 1 to 200 characters.
        details:
          type: string
          description: At most 20000 characters. Empty when none was given.
        options:
          type: array
          description: The suggested answers, at most 10 of 1 to 80 characters.
          items:
            type: string
        mode:
          type: string
          enum: [stop, poll]
        blocking:
          type: boolean
          description: It blocks its task while it is open.
        state:
          type: string
          enum: [open, answered, withdrawn]
        answer:
          type: string
          description: Absent until it is answered.
        answered_by:
          type: string
          description: The handle of the actor that answered it.
        on_behalf_of:
          type: string
          description: The handle of the person a relayed answer came from.
        channel:
          type: string
          enum: [ui, api, relay]
          description: How the answer reached the board. Absent until it is answered.
        created_at:
          type: string
          format: date-time
        answered_at:
          type: string
          format: date-time
        withdrawn_at:
          type: string
          format: date-time
        withdraw_reason:
          type: string
        ended_at:
          type: string
          format: date-time
          description: >-
            The server's clock read just after the answer or withdrawal committed, rounded up to the millisecond, so
            never before the end took effect (`answered_at` and `withdrawn_at` are read before the commit). Absent
            while the ask is open, and for an end recorded without one.
        asker_waiting:
          type: boolean
          description: It is open, its mode is `poll` and a long poll on it was seen within the last 60 seconds.
    AskRaise:
      type: object
      description: The ask to raise.
      required: [question]
      properties:
        task:
          type: string
          description: A task ref or ULID.
        initiative:
          type: string
          description: An initiative slug or ULID. With a task it must be the task's own initiative.
        question:
          type: string
          description: One line, 1 to 200 characters.
        details:
          type: string
          description: At most 20000 characters.
        options:
          type: array
          description: At most 10 strings of 1 to 80 characters.
          items:
            type: string
        mode:
          type: string
          enum: [stop, poll]
          description: Default stop.
        blocking:
          type: boolean
          description: Default false.
        lease_action:
          type: string
          enum: [none, keep, stop]
          description: >-
            What the raise does to the caller's live lease on the task. `none` (default) leaves it, `keep` leaves it live
            and `stop` ends it with the outcome `blocked on A<n>`.
    AskRaised:
      description: A raised ask, with the caller's lease on its task when `lease_action` was `keep` or `stop` and one was live.
      allOf:
        - $ref: "#/components/schemas/Ask"
        - type: object
          properties:
            lease:
              $ref: "#/components/schemas/Lease"
    AskAnswer:
      type: object
      description: The answer to an open ask.
      required: [answer]
      properties:
        answer:
          type: string
          description: 1 to 20000 characters.
        channel:
          type: string
          enum: [ui, api, relay]
          description: Default ui for a browser session and api for a key.
        on_behalf_of:
          type: string
          description: The handle of the person a relayed answer came from. Channel relay only.
    AskWithdraw:
      type: object
      description: Why the ask was withdrawn.
      properties:
        reason:
          type: string
          description: At most 200 characters.
    AskList:
      type: object
      description: A page of asks.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ask"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    Note:
      type: object
      description: A note. `body` is present only when the note has one and the read asked for it.
      required: [id, ref, author, summary, has_body, mentions, broadcast, created_at]
      properties:
        id:
          type: string
          description: The note's ULID.
        ref:
          type: string
          description: The short ref, `N<n>`.
        author:
          type: string
          description: The handle of the actor that posted it.
        summary:
          type: string
          description: One line, 1 to 200 characters.
        body:
          type: string
          description: Markdown, at most 20000 characters. Left out of a summary list.
        has_body:
          type: boolean
          description: The note has a body, whether or not it is in this document.
        task:
          type: string
          description: The ref of the task it is on.
        initiative:
          type: string
          description: The slug of the initiative, derived from the task when there is one.
        resource:
          type: string
          description: At most 100 characters, such as `host:build-1`.
        mentions:
          type: array
          description: The actor handles it mentions.
          items:
            type: string
        broadcast:
          type: boolean
          description: It has neither a task nor an initiative.
        created_at:
          type: string
          format: date-time
    NotePost:
      type: object
      description: The note to post.
      required: [summary]
      properties:
        summary:
          type: string
          description: One line, 1 to 200 characters.
        body:
          type: string
          description: At most 20000 characters.
        task:
          type: string
          description: A task ref or ULID.
        initiative:
          type: string
          description: An initiative slug or ULID. With a task it must be the task's own initiative.
        resource:
          type: string
          description: 1 to 100 characters once trimmed when supplied (an empty string is refused); leave it out for none.
        mentions:
          type: array
          description: At most 20 actor handles without whitespace.
          items:
            type: string
    NoteList:
      type: object
      description: A page of notes.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    CursorSet:
      type: object
      description: The position to move a read cursor to.
      required: [position]
      properties:
        position:
          type: string
          description: A note ULID or `N<n>` (stream `notes`), an event ULID or `E<n>` (stream `events`).
    Cursor:
      type: object
      description: A read cursor of the caller.
      required: [stream, position, ref]
      properties:
        stream:
          type: string
          description: "`notes` or `events`."
        position:
          type: string
          description: The ULID of the last note or event read on the stream.
        ref:
          type: string
          description: The short ref of that item, `N<n>` or `E<n>`.
    EventList:
      type: object
      description: A page of events.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    Notification:
      type: object
      description: One row of the alert outbox.
      required: [id, kind, state, event, attempts, created_at, payload]
      properties:
        id:
          type: string
          description: The row's ULID.
        kind:
          type: string
          enum: [stranded, asking, done]
        state:
          type: string
          description: Where the row is in its delivery.
          enum: [pending, sent, failed]
        event:
          type: string
          description: The ref `E<n>` of the event that enqueued the row.
          examples: [E42]
        attempts:
          type: integer
          description: How many POSTs were made.
        next_attempt_at:
          type: string
          format: date-time
          description: When a `pending` row is next due. Absent for a `sent` or `failed` row.
        last_error:
          type: string
          description: "`http <status>`, `timeout` or `network error`, from the last failed POST. Absent when none failed."
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
          description: When a 2xx was received. Absent until the row is `sent`.
        payload:
          type: object
          additionalProperties: true
          description: The JSON the receiver is sent (SPEC 5.4).
    Timeline:
      type: object
      description: What falls in a window of time.
      required: [from, to, initiatives, tasks, leases, markers]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        initiatives:
          type: array
          items:
            $ref: "#/components/schemas/TimelineInitiative"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/TimelineTask"
        leases:
          type: array
          items:
            $ref: "#/components/schemas/TimelineLease"
        markers:
          type: array
          items:
            $ref: "#/components/schemas/TimelineMarker"
    TimelineInitiative:
      type: object
      description: An initiative that holds a task of the window.
      required: [slug, title, tags, closed]
      properties:
        slug:
          type: string
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        closed:
          type: boolean
    TimelineTask:
      type: object
      description: A task of the window.
      required: [ref, initiative, title, status, kind, created_at, attention, deps, tags, tag_marks]
      properties:
        ref:
          type: string
        initiative:
          type: string
          description: The slug of the task's initiative.
        title:
          type: string
        status:
          type: string
          enum: [open, done, closed]
        kind:
          type: string
          enum: [work, watch]
        tags:
          type: array
          description: The task's own tags, sorted. Empty when it has none.
          items:
            type: string
        tag_marks:
          type: array
          description: >-
            Every tag the task shows with its source, as for `Task`: its own, then its initiative's, then the derived
            actor-kind tags.
          items:
            $ref: "#/components/schemas/TagMark"
        planned_start:
          type: string
          format: date-time
        planned_end:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        attention:
          type: array
          description: Why the task needs a person, as for `GET /api/v1/tasks`. Empty for a task that needs nothing.
          items:
            $ref: "#/components/schemas/TaskAttention"
        deps:
          type: array
          description: The refs of the tasks this one is blocked by.
          items:
            type: string
    TimelineLease:
      type: object
      description: A lease that overlaps the window.
      required: [ref, task, holder, state, started_at, intent]
      properties:
        ref:
          type: string
        task:
          type: string
        holder:
          type: string
          description: The handle of the actor that holds or held the lease.
        state:
          type: string
          enum: [live, ended, expired]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          description: When an ended lease was ended, or when an expired lease expired. Absent while it is live.
        intent:
          type: string
    TimelineMarker:
      type: object
      description: A point in time on a task.
      required: [task, type, at, label]
      properties:
        task:
          type: string
        type:
          type: string
          enum: [milestone, ask, check, done, closed]
        at:
          type: string
          format: date-time
        label:
          type: string
          description: The milestone's or check's summary, the ask's question, or the event's one-line summary for done and closed.
    ActorList:
      type: object
      description: The actors, the one seen last first.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActorView"
    ActorView:
      type: object
      description: An actor with what it holds and has asked now.
      required: [handle, kind, last_seen, leases, asks]
      properties:
        handle:
          type: string
        kind:
          type: string
          enum: [operator, agent]
        way_back:
          type: string
          description: How to reach the actor again. Absent when the board has none.
        origin:
          type: string
          description: |-
            The handle of the operator actor whose key made the agent's latest write (its owner). Absent for an
            operator, for an agent no keyed write has reached, and for one whose latest write came through a key
            with no owner.
        last_seen:
          type: string
          format: date-time
        leases:
          type: array
          description: The actor's live leases, oldest first.
          items:
            $ref: "#/components/schemas/ActorLease"
        asks:
          type: array
          description: The actor's open asks, in the order they were raised.
          items:
            $ref: "#/components/schemas/ActorAsk"
    ActorLease:
      type: object
      description: A live lease of an actor.
      required: [ref, task, intent, expires_at, resources]
      properties:
        ref:
          type: string
          description: The short ref, `L<n>`.
        task:
          type: string
          description: The ref of the task it is on.
        intent:
          type: string
        expires_at:
          type: string
          format: date-time
        resources:
          type: array
          description: The resources it holds, sorted.
          items:
            type: string
    ActorAsk:
      type: object
      description: An open ask of an actor.
      required: [ref, question, mode, blocking, created_at]
      properties:
        ref:
          type: string
          description: The short ref, `A<n>`.
        task:
          type: string
          description: The ref of the task it is on. Absent for an ask on an initiative or board-wide.
        initiative:
          type: string
          description: The slug of the initiative. Absent for a board-wide ask.
        question:
          type: string
        mode:
          type: string
          enum: [stop, poll]
        blocking:
          type: boolean
        created_at:
          type: string
          format: date-time
    NotificationList:
      type: object
      description: A page of notifications.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_after:
          type: string
          description: The `after` value that fetches the following page. Absent on the last page.
    TaskPatch:
      type: object
      description: >-
        The fields to change. A field left out keeps its value. `null` clears `planned_start`, `planned_end` and
        `next_check_at`, and is 400 for the others, `cadence_seconds` included.
      properties:
        title:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: 1 to 200 characters.
        description:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Markdown, at most 20000 characters.
        planned_start:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
        planned_end:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
        cadence_seconds:
          type: [integer, "null"]
          format: int64
          x-go-type: Maybe[int64]
          x-go-type-skip-optional-pointer: true
          description: Watch tasks only, and never cleared. 60 to 31536000.
        next_check_at:
          type: [string, "null"]
          format: date-time
          x-go-type: Maybe[time.Time]
          x-go-type-skip-optional-pointer: true
          description: Watch tasks only.
        external_refs:
          type: [array, "null"]
          x-go-type: Maybe[[]ExternalRef]
          x-go-type-skip-optional-pointer: true
          description: Replaces the list. At most 20.
          items:
            $ref: "#/components/schemas/ExternalRef"
        kind:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
        initiative:
          type: [string, "null"]
          x-go-type: Maybe[string]
          x-go-type-skip-optional-pointer: true
          description: Immutable. Sending it, even unchanged, is 400.
    Session:
      type: object
      description: A browser session.
      required: [email, principal, actor, csrf_token]
      properties:
        email:
          type: string
          description: The verified email the session belongs to.
        principal:
          type: string
          description: Who authenticated, `oidc:<email>`.
        actor:
          type: string
          description: The actor the session acts as, the operator handle of its email.
        csrf_token:
          type: string
          description: The value cookie-authenticated writes send as `X-CSRF-Token`.
    Meta:
      type: object
      description: The server and the caller.
      required: [version, protocol, principal, actor]
      properties:
        version:
          type: string
          description: The version the server binary was built as (`vh version`'s first field).
        revision:
          type: string
          description: >-
            The commit the server binary was built from, as the image build stamped it
            (the VERSION and REVISION build args); absent when the build recorded none.
        protocol:
          type: integer
          description: The agent protocol version the server binary embeds (`vh help agent`).
        principal:
          type: string
          description: Who authenticated, such as `key:workstation` or `oidc:<email>`.
        actor:
          type: string
          description: The actor the request acts as.
    ProtocolSeenRequest:
      type: object
      description: The agent protocol version the caller has read.
      required: [version]
      properties:
        version:
          type: integer
          minimum: 0
          description: The protocol version, as `vh help agent --version` prints it.
    ProtocolSeen:
      type: object
      description: An actor and the highest agent protocol version it has read.
      required: [actor, protocol_seen]
      properties:
        actor:
          type: string
          description: The actor's handle.
        protocol_seen:
          type: integer
          description: The highest protocol version this actor has read.
    Problem:
      type: object
      description: An RFC 9457 problem document.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: A human-readable explanation of this occurrence.
        instance:
          type: string
          description: A URI reference that identifies this occurrence.
        next:
          type: string
          description: The suggested next action, a sentence the CLI prints.
        expired_at:
          type: string
          format: date-time
          description: On the 410 of a lease renewal, when the lease expired.
